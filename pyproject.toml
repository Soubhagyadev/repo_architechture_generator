[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-analyzer"
version = "0.1.0"
description = "AI-powered GitHub repository analyzer: architecture, docs, grounded Q&A, and bug-investigation guidance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "repo-analyzer developers" }]
keywords = ["github", "static-analysis", "architecture", "llm", "codebase"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repo-analyzer = "repo_analyzer.cli:app"

[tool.setuptools.packages.find]
include = ["repo_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
